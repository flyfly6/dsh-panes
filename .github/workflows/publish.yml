name: publish

# Publishes to npm with trusted publishing (OIDC): no npm token lives in this
# repository. A `v*` tag publishes; `workflow_dispatch` re-runs the same job.
# One-time setup on npmjs.com: the package's Settings -> Trusted Publisher ->
# GitHub Actions, user `flyfly6`, repository `dsh-panes`, workflow `publish.yml`.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for npm trusted publishing
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Verify the tag matches package.json
        if: github.event_name == 'push'
        run: '[ "v$(node -p "require(\"./package.json\").version")" = "$GITHUB_REF_NAME" ]'

      # `prepublishOnly` builds lib/ before the tarball is packed. Provenance is
      # attached automatically for OIDC publishes from a public repository.
      - run: npm publish
